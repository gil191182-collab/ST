<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1B2440; color: #fff;
         font-family: Poppins, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { opacity: .85; max-width: 320px; margin: 0 auto 20px; line-height: 1.5; }
  button { background: #B35A0C; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Sin conexión a internet</h1>
    <p>Para ver la información de los trámites necesita conexión. Revise su internet e intente de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
