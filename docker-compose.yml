# Strateggia Logistics — se instala en /opt/logistics/app
# Red, base de datos y volúmenes PROPIOS. Lo único compartido es la red "logistics-proxy",
# por donde el Caddy del servidor (contenedor certifai-caddy) llega a la web y la API.
name: logistics

x-app: &app
  image: logistics-api:${VERSION:-actual}
  build: { context: ., target: api }
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://logistics_app:${APP_DB_PASSWORD}@postgres:5432/logistics
    ARCHIVOS_CARPETA: /datos/archivos
    # Llave de la cuenta de servicio de Google Drive (fuera de git, solo lectura)
    GOOGLE_DRIVE_JSON: /app/secretos/google-drive.json
  volumes:
    - archivos:/datos/archivos
    - ./secretos:/app/secretos:ro
  networks: [logistics]
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [logistics]
    # Sin puertos publicados: solo la red interna de logistics la ve.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics_admin -d logistics"]
      interval: 10s
      retries: 5
    mem_limit: 512m

  migrar:
    <<: *app
    restart: "no"
    command: ["node", "db/migrar.js"]
    environment:
      DATABASE_ADMIN_URL: postgresql://logistics_admin:${DB_ADMIN_PASSWORD}@postgres:5432/logistics
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    profiles: [herramientas]

  api:
    <<: *app
    ports: ["127.0.0.1:${API_PUERTO_HOST:-3101}:3101"]
    networks:
      logistics: {}
      proxy: { aliases: [logistics-api] }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3101/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      retries: 3
    mem_limit: 320m

  worker:
    <<: *app
    command: ["node", "apps/api/src/worker.js"]
    mem_limit: 192m

  web:
    image: logistics-web:${VERSION:-actual}
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      API_INTERNA: http://api:3101
    ports: ["127.0.0.1:${WEB_PUERTO_HOST:-3100}:3100"]
    networks:
      logistics: {}
      proxy: { aliases: [logistics-web] }
    depends_on: [api]
    mem_limit: 384m

networks:
  logistics:
    name: logistics_red
  # Red compartida SOLO con el proxy (Caddy de certifai). La base de datos no está en ella.
  proxy:
    name: logistics-proxy
    external: true

volumes:
  postgres: { name: logistics_postgres }
  archivos: { name: logistics_archivos }
