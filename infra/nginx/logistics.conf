# Strateggia Logistics — bloque PROPIO de Nginx.
# Va en /etc/nginx/sites-available/logistics.conf (enlace en sites-enabled).
# No toca la configuración de CertifAI.
#
# Dominios:
#   logistics.strateggia.mx            → despacho por defecto (Strateggia)
#   staging.logistics.strateggia.mx    → pruebas antes de producción
#   <despacho>.logistics.strateggia.mx → cada despacho cliente
# El certificado comodín (*.logistics.strateggia.mx) requiere validación DNS;
# mientras tanto se usan certificados por nombre (ver docs/instalacion.md).

limit_req_zone $binary_remote_addr zone=logistics_entrar:10m rate=10r/m;

upstream logistics_web { server 127.0.0.1:3100; keepalive 16; }
upstream logistics_api { server 127.0.0.1:3101; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name logistics.strateggia.mx *.logistics.strateggia.mx;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name logistics.strateggia.mx *.logistics.strateggia.mx;

    ssl_certificate     /etc/letsencrypt/live/logistics.strateggia.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics.strateggia.mx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Inicio de sesión con límite de intentos
    location = /api/sesion {
        limit_req zone=logistics_entrar burst=5 nodelay;
        proxy_pass http://logistics_api;
    }
    location /api/      { proxy_pass http://logistics_api; proxy_read_timeout 120s; }
    location /archivos/ { proxy_pass http://logistics_api; }
    location /          { proxy_pass http://logistics_web; }
}
